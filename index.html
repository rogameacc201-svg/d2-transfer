<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 Survivors 存檔轉移工具</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #121212; color: #fff; padding: 10px; }
        .bookmark-btn { 
            padding: 15px 25px; 
            font-size: 16px; 
            background-color: #ffcc00; 
            color: #000; 
            border: none; 
            cursor: grab; 
            font-weight: bold; 
            border-radius: 5px; 
            text-decoration: none; 
            display: inline-block; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 10px 0;
        }
        .bookmark-btn:hover { background-color: #e6b800; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 10px; display: inline-block; max-width: 600px; width: 100%; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; }
        .tip { color: #ffcc00; font-weight: bold; }
        .warning { color: #ff4d4d; font-weight: bold; }
        input[type="file"] { background: #2a2a2a; color: #fff; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; margin: 10px 0; border: 1px solid #444; }
        .action-btn { 
            padding: 12px 20px; 
            font-size: 15px; 
            background-color: #00cc66; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            display: block; 
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:hover { background-color: #00b359; }
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>D2 Survivors 存檔轉移工具</h1>
    <div class="box">
        <p class="tip">💡 為了避免長文字被系統自動省略（...），我們改用「檔案」傳輸，保證 100% 完整不失真！</p>
        <br>

        <h3>【步驟一：電腦端 - 匯出存檔】</h3>
        <p>將下方黃色按鈕<span class="tip">拖曳到書籤列</span>：</p>
        <div style="text-align: center;">
            <a class="bookmark-btn" href="javascript:(function(){let rawData=localStorage.getItem('d2-survivors/save/v1');if(!rawData){let saveKey=Object.keys(localStorage).find(k=>localStorage.getItem(k).includes('gold'));if(saveKey)rawData=localStorage.getItem(saveKey);}if(!rawData){alert('❌ 找不到遊戲存檔！');return;}let blob=new Blob([rawData],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='d2_save.json';a.click();alert('💾 完整存檔檔案已下載！');})();">💾 下載完整存檔檔案</a>
        </div>
        <p style="font-size: 13px; color: #aaa;">* 在遊戲中點擊此書籤，會直接下載一個 `d2_save.json` 檔案。</p>

        <hr>

        <h3>【步驟二：手機端 - 匯入存檔】</h3>
        <p>把下載的檔案傳到手機（透過 LINE 傳檔案），然後在這裡選擇該檔案並寫入：</p>
        <input type="file" id="saveFile" accept=".json">
        <button class="action-btn" onclick="importSaveFile()">📥 一鍵寫入手機遊戲存檔</button>
    </div>

    <script>
        function importSaveFile() {
            let fileInput = document.getElementById('saveFile');
            if (fileInput.files.length === 0) {
                alert('❌ 請先選擇下載好的 `d2_save.json` 檔案！');
                return;
            }

            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                let saveStr = e.target.result;
                try {
                    let cleanStr = saveStr.replace(/[\r\n]+/g, "").trim();
                    JSON.parse(cleanStr); // 嚴格驗證 JSON
                    
                    localStorage.setItem('d2-survivors/save/v1', cleanStr);
                    localStorage.removeItem('d2-survivors/save/v1/unreadable');
                    alert('✨ 手機存檔寫入成功！\n請打開手機遊戲網頁重新整理 (F5) 即可同步！');
                } catch (err) {
                    alert('❌ 檔案格式錯誤，這不是合法的遊戲存檔！');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>

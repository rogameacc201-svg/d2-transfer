<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 Survivors 存檔與修改工具</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #121212; color: #fff; padding: 10px; }
        .bookmark-btn { 
            padding: 12px 20px; 
            font-size: 16px; 
            background-color: #ffcc00; 
            color: #000; 
            border: none; 
            cursor: grab; 
            font-weight: bold; 
            border-radius: 5px; 
            text-decoration: none; 
            display: inline-block; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 10px 0;
        }
        .bookmark-btn:active { cursor: grabbing; }
        .bookmark-btn:hover { background-color: #e6b800; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 10px; display: inline-block; max-width: 600px; width: 100%; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; }
        .tip { color: #ffcc00; font-weight: bold; }
        .warning { color: #ff4d4d; font-weight: bold; }
        textarea { width: 100%; height: 120px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 8px; box-sizing: border-box; margin-top: 10px; }
        .action-btn { 
            padding: 12px 20px; 
            font-size: 15px; 
            background-color: #00cc66; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            display: block; 
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:hover { background-color: #00b359; }
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>D2 Survivors 工具箱</h1>
    <div class="box">
        <p class="warning">⚠️ 更改遊戲會破壞遊戲樂趣，想清楚再改！</p>
        <br>

        <h3>【功能一：遊戲內書籤】</h3>
        <p>請將下方黃色按鈕<span class="tip">拖曳到你的瀏覽器書籤列</span>：</p>
        <div style="text-align: center;">
            <a class="bookmark-btn" href="javascript:(function(){let rawData=localStorage.getItem('d2-survivors/save/v1');if(!rawData){let saveKey=Object.keys(localStorage).find(k=>localStorage.getItem(k).includes('gold'));if(saveKey)rawData=localStorage.getItem(saveKey);}if(!rawData){alert('❌ 找不到遊戲存檔，請確認你已經在遊戲中存檔過！');return;}prompt('請直接複製以下存檔文字：', rawData);})();">📋 顯示並複製遊戲存檔</a>
        </div>
        <p style="font-size: 13px; color: #aaa;">* 在遊戲中點擊此書籤，會直接跳出視窗讓你複製整串存檔。</p>

        <hr>

        <h3>【功能二：手機/跨裝置還原存檔】</h3>
        <p>將剛才複製的存檔文字貼在下方，點擊按鈕即可寫入：</p>
        <textarea id="saveInput" placeholder="請將存檔 JSON 文字貼在這裡..."></textarea>
        <button class="action-btn" onclick="importSave()">📥 寫入存檔到此瀏覽器</button>
    </div>

    <script>
        function importSave() {
            let text = document.getElementById('saveInput').value.trim();
            if (!text) {
                alert('❌ 請先貼上存檔文字！');
                return;
            }

            try {
                // 自動修復換行與空白
                let cleanText = text.replace(/[\r\n]+/g, "").trim();
                JSON.parse(cleanText); // 驗證是否為合法 JSON

                localStorage.setItem('d2-survivors/save/v1', cleanText);
                localStorage.removeItem('d2-survivors/save/v1/unreadable');
                alert('✨ 存檔寫入成功！\n請重新整理遊戲網頁 (F5) 即可！');
            } catch (e) {
                alert('❌ 格式錯誤，這不是合法的遊戲存檔 JSON！請確認是否有完整複製。');
            }
        }
    </script>
</body>
</html>

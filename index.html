<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 Survivors QR Code 存檔轉移工具</title>
    <!-- 引入 qrcode.js 產生器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #121212; color: #fff; padding: 10px; }
        .bookmark-btn { 
            padding: 12px 20px; 
            font-size: 16px; 
            background-color: #ffcc00; 
            color: #000; 
            border: none; 
            cursor: grab; 
            font-weight: bold; 
            border-radius: 5px; 
            text-decoration: none; 
            display: inline-block; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 10px 0;
        }
        .bookmark-btn:hover { background-color: #e6b800; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 10px; display: inline-block; max-width: 600px; width: 100%; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box; }
        .tip { color: #ffcc00; font-weight: bold; }
        .warning { color: #ff4d4d; font-weight: bold; }
        .action-btn { 
            padding: 12px 20px; 
            font-size: 15px; 
            background-color: #00cc66; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            display: block; 
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:hover { background-color: #00b359; }
        #qrcode { background: #fff; padding: 15px; display: inline-block; border-radius: 8px; margin-top: 15px; }
        textarea { width: 100%; height: 90px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 8px; box-sizing: border-box; margin-top: 10px; }
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>D2 Survivors QR Code 轉移工具</h1>
    <div class="box">
        <p class="tip">💡 堅持使用 QR Code 點對點離線傳輸，絕對安全、絕不外洩！</p>
        <br>

        <h3>【步驟一：電腦端 - 取得 QR Code】</h3>
        <p>1. 把下方黃色按鈕<span class="tip">拖曳到書籤列</span>：</p>
        <div style="text-align: center;">
            <a class="bookmark-btn" href="javascript:(function(){let rawData=localStorage.getItem('d2-survivors/save/v1');if(!rawData){let saveKey=Object.keys(localStorage).find(k=>localStorage.getItem(k).includes('gold'));if(saveKey)rawData=localStorage.getItem(saveKey);}if(!rawData){alert('❌ 找不到遊戲存檔！');return;}localStorage.setItem('d2_temp_transfer', rawData);window.open('https://jtnhrbpvvm-spec.github.io/taiwan_game2/D2%E4%BF%AE%E6%94%B9%E7%89%88/','_blank');})();">🔲 生成 QR Code 轉移</a>
        </div>
        <p>2. 在遊戲中點擊該書籤，會自動開啟此網頁並載入您的存檔。</p>

        <hr>

        <h3>【步驟二：手機端 - 掃描寫入】</h3>
        <p>請用手機相機掃描下方自動產生的 QR Code：</p>
        
        <div style="text-align: center;" id="qrcode-container">
            <div id="qrcode"></div>
            <p id="qr-status" style="font-size: 13px; color: #aaa; margin-top: 5px;">正在讀取存檔...</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 從本機暫存讀取剛剛書籤抓到的存檔
            let rawData = localStorage.getItem('d2_temp_transfer');
            
            if (rawData) {
                try {
                    JSON.parse(rawData); // 驗證 JSON
                    
                    document.getElementById('qr-status.innerText = "✅ QR Code 已準備就緒，請用手機相機掃描！"';
                    
                    // 清空並產生 QR Code
                    document.getElementById("qrcode").innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), {
                        text: rawData,
                        width: 250,
                        height: 250,
                        correctLevel: QRCode.CorrectLevel.L // 使用低容錯率以容納最多字元
                    });
                    
                    document.getElementById('qr-status').innerText = "✅ QR Code 已產生，請用手機掃描！";
                } catch (e) {
                    document.getElementById('qr-status').innerText = "❌ 存檔解析失敗";
                }
            } else {
                document.getElementById('qr-status').innerText = "❌ 尚未偵測到存檔，請先在遊戲中點擊書籤！";
            }
        };
    </script>
</body>
</html>

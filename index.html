<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2 Survivors 修改與存檔轉移工具</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #121212; color: #fff; padding: 10px; }
        .bookmark-btn { 
            padding: 12px 20px; 
            font-size: 16px; 
            background-color: #ffcc00; 
            color: #000; 
            border: none; 
            cursor: grab; 
            font-weight: bold; 
            border-radius: 5px; 
            text-decoration: none; 
            display: inline-block; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 8px 0;
        }
        .bookmark-btn:active { cursor: grabbing; }
        .bookmark-btn:hover { background-color: #e6b800; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 10px; display: inline-block; max-width: 600px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        ol { line-height: 1.8; }
        .tip { color: #ffcc00; font-weight: bold; }
        .warning { color: #ff4d4d; font-weight: bold; }
        
        .action-btn { 
            padding: 12px 20px; 
            font-size: 15px; 
            background-color: #00cc66; 
            color: #fff; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            display: block; 
            width: 100%;
            margin: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .action-btn:hover { background-color: #00b359; }
        input[type="file"] { background: #2a2a2a; color: #fff; padding: 8px; border-radius: 5px; width: 100%; box-sizing: border-box; margin: 10px 0; }
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>D2 Survivors 工具箱</h1>
    <div class="box">
        <p class="warning">⚠️ 更改遊戲會破壞遊戲樂趣，想清楚再改！</p>
        <p class="tip">💡 貼心提醒：改錢前需要身上有金幣，並且存檔過一次後才會生效喔！</p>
        <br>

        <h3>【步驟一：電腦端 - 安裝書籤】</h3>
        <p>把下面這兩個黃色按鈕，<span class="tip">按住不放拖曳到你的瀏覽器書籤列</span>：</p>
        
        <div style="text-align: center; margin: 15px 0;">
            <!-- 按鈕 1：改金幣 -->
            <a class="bookmark-btn" href="javascript:(function(){let rawData=localStorage.getItem('d2-survivors/save/v1');if(!rawData){let saveKey=Object.keys(localStorage).find(k=>localStorage.getItem(k).includes('gold'));if(saveKey){rawData=localStorage.getItem(saveKey);let data=JSON.parse(rawData);data.gold=999999;localStorage.setItem(saveKey,JSON.stringify(data));alert('✨ 金幣修改成功！請按 F5 重新整理！');return;}alert('❌ 找不到遊戲存檔，請確認你正在 https://d2survivors.lol 遊戲頁面中！');return;}let data=JSON.parse(rawData);data.gold=999999;localStorage.setItem('d2-survivors/save/v1',JSON.stringify(data));localStorage.removeItem('d2-survivors/save/v1/unreadable');alert('✨ 成功！金幣已改為 999,999，請按 F5 重新整理！');})();">🔥 D2 Survivors 改金幣</a>
            
            <br>

            <!-- 按鈕 2：下載電腦存檔檔案 -->
            <a class="bookmark-btn" href="javascript:(function(){let rawData=localStorage.getItem('d2-survivors/save/v1');if(!rawData){let saveKey=Object.keys(localStorage).find(k=>localStorage.getItem(k).includes('gold'));if(saveKey)rawData=localStorage.getItem(saveKey);}if(!rawData){alert('❌ 找不到遊戲存檔，請確保你已經進入遊戲並存檔過！');return;}let blob=new Blob([rawData],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='d2_save.json';a.click();alert('💾 存檔檔案已下載！請傳送到手機上。');})();">💾 下載電腦存檔檔案</a>
        </div>

        <hr>

        <h3>【步驟二：手機端 - 上傳並還原存檔】</h3>
        <p>1. 在電腦遊戲畫面點剛拖過去的 **「💾 下載電腦存檔檔案」**，把檔案傳到手機（用 LINE 傳檔案）。</p>
        <p>2. 用手機打開這個網頁，選擇該檔案並點擊按鈕寫入：</p>
        <input type="file" id="saveFile" accept=".json">
        <button class="action-btn" onclick="importSaveFile()">📥 一鍵寫入手機遊戲存檔</button>
        <p style="font-size: 13px; color: #aaa;">* 寫入成功後，開啟手機上的遊戲網頁按重新整理 (F5) 即可！</p>
    </div>

    <script>
        function importSaveFile() {
            let fileInput = document.getElementById('saveFile');
            if (fileInput.files.length === 0) {
                alert('❌ 請先選擇下載好的存檔檔案！');
                return;
            }

            let file = fileInput.files[0];
            let reader = new FileReader();
            reader.onload = function(e) {
                let saveStr = e.target.result;
                try {
                    JSON.parse(saveStr);
                    localStorage.setItem('d2-survivors/save/v1', saveStr);
                    localStorage.removeItem('d2-survivors/save/v1/unreadable');
                    alert('✨ 手機存檔寫入成功！\n現在打開手機遊戲網頁並重新整理，就能同步進度囉！');
                } catch (err) {
                    alert('❌ 檔案格式不正確，請確認是否為正確的存檔檔案！');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
